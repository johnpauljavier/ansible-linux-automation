---
- name: Enable HTTPS for Grafana
  hosts: linux_servers
  become: yes

  tasks:
    - name: Configure Grafana HTTPS settings
      ansible.builtin.ini_file:
        path: /etc/grafana/grafana.ini
        section: server
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        owner: root
        group: grafana
        mode: '0640'
      loop:
        - option: protocol
          value: https
        - option: cert_file
          value: /etc/grafana/ssl/grafana.crt
        - option: cert_key
          value: /etc/grafana/ssl/grafana.key
      notify: Restart Grafana

  handlers:
    - name: Restart Grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
        enabled: yes
